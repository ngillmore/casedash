name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build renderer (Qt6)
    # NOT ubuntu-latest. That resolves to 24.04, whose layer-shell-qt is
    # 5.27.11 -- a Plasma 5 / Qt5 build. There is no Qt6 layer-shell-qt package
    # in noble at all, so the renderer cannot link there no matter what we do.
    # Qt6 builds only exist from 25.04 onward (6.3.4), and setScreen() needs
    # 6.7+ (26.04). 24.04 is still covered by the collector job below.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # Qt6 dev packages: Core/Gui/Qml/Quick, the Qt6 moc, and layer-shell-qt
      # for output pinning.
      # NOTE: qt6-base-dev-tools is what provides the Qt6 moc. Without it the
      # build picks up Qt5's /usr/bin/moc and fails with misleading errors.
      - name: Install Qt6 and layer-shell-qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            liblayershellqtinterface-dev \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-layouts qt6-declarative-dev-tools

      - name: Show which moc and layer-shell-qt we get
        run: |
          which -a moc moc6 || true
          moc --version || true
          dpkg -l | grep -i layershell || true
          ls /usr/include/LayerShellQt/ || true

      # The build script is the real contract: if this passes, a stranger can
      # compile the renderer. No cmake involved by design.
      - name: Build renderer
        run: ./renderer/build.sh

      - name: Confirm the binary exists
        run: test -x renderer/build/casedash

      # Qt can load a QML tree without a display, which catches syntax errors and
      # unresolved imports -- the two failure modes that produce a black panel.
      - name: Check QML parses
        run: |
          for f in renderer/qml/*.qml; do
            echo "::group::$f"
            qmllint "$f" || echo "qmllint reported issues in $f (non-fatal)"
            echo "::endgroup::"
          done

  collector:
    name: Collector syntax + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Byte-compile
        run: python3 -m py_compile collector/casedash_collector.py

      # The collector must be importable and survive a few ticks on a machine
      # with none of the hardware probes present. Every probe degrades to null
      # rather than raising -- that is the design contract, so assert it.
      - name: Import + config defaults
        run: |
          python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location(
              "c", "collector/casedash_collector.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert m.NET_IFACE, "NET_IFACE must resolve"
          assert m.WX_LOCATION, "WX_LOCATION must resolve"
          print("NET_IFACE  =", m.NET_IFACE)
          print("WX_LOCATION=", m.WX_LOCATION)
          PY

      - name: Env overrides are honoured
        env:
          CASEDASH_NET_IFACE: wlan0
          CASEDASH_WX_LOCATION: London
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              "c", "collector/casedash_collector.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert m.NET_IFACE == "wlan0", m.NET_IFACE
          assert m.WX_LOCATION == "London", m.WX_LOCATION
          print("overrides ok")
          PY

  verify:
    name: Verifier logic (content checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Byte-compile the checker
        run: python3 -m py_compile collector/casedash_verify.py

      # The weather check is the only thing in the project that can catch a
      # live-but-wrong reading, so its own logic must be tested. Without this
      # job, a future edit to the comparison silently stops catching the very
      # bug it was written for.
      - name: Run content-check tests
        run: python3 tests/test_verify_content.py

      # The panel is a fixed 3840px tall with no scrolling. If the sections
      # exceed it, QML overlaps them rather than clipping -- which is how the
      # CPU sparkline ended up rendering behind the GPU card. This asserts the
      # arithmetic instead of trusting the eye.
      - name: Run layout budget tests
        run: python3 tests/test_layout_budget.py

      # A scripted edit once closed a string literal early in main.qml. Every
      # Python test still passed; the renderer crash-looped with a QML parse
      # error that only showed up in the journal after a rebuild. Catch it here.
      - name: Run QML syntax tests
        run: python3 tests/test_qml_syntax.py

      # The checker is a real CLI used by verify.sh; exercise the contract
      # (exit 1 only on a definite mismatch) end to end.
      - name: CLI contract -- matching location passes
        run: |
          cat > /tmp/state.json <<'JSON'
          {"ts":1,"weather":{"area":"Little Rock","lat":34.746,"lon":-92.289}}
          JSON
          python3 collector/casedash_verify.py /tmp/state.json 34.746,-92.289

      - name: CLI contract -- wrong continent fails
        run: |
          cat > /tmp/state.json <<'JSON'
          {"ts":1,"weather":{"area":"Campo Salles","lat":-33.4,"lon":-60.233}}
          JSON
          if python3 collector/casedash_verify.py /tmp/state.json 34.746,-92.289; then
            echo "::error::the Argentina regression is no longer caught"
            exit 1
          fi
          echo "wrong location correctly rejected"

      - name: CLI contract -- unevaluable data is not a failure
        run: |
          echo '{"ts":1}' > /tmp/state.json
          python3 collector/casedash_verify.py /tmp/state.json 34.746,-92.289

      # verify.sh must be syntactically valid and must not hard-depend on the
      # hardware it inspects -- on CI there is no KWin and no panel.
      - name: verify.sh is valid bash
        run: bash -n verify.sh

      - name: verify.sh degrades gracefully with no panel and no state
        run: |
          set +e
          CASEDASH_VERIFY_WX_LATLON=34.746,-92.289 \
            XDG_RUNTIME_DIR=/tmp/nonexistent-runtime \
            ./verify.sh
          rc=$?
          # No panel on CI means a non-zero verdict is expected; what matters is
          # that it reports the weather step rather than crashing on it.
          echo "verify.sh exited $rc (non-zero expected: no KWin on CI)"
          [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ] || exit 1

      - name: verify.sh reports the weather step in its output
        run: |
          CASEDASH_VERIFY_WX_LATLON=34.746,-92.289 \
            XDG_RUNTIME_DIR=/tmp/nonexistent-runtime \
            ./verify.sh 2>&1 | tee /tmp/verify.out
          grep -q "weather" /tmp/verify.out || {
            echo "::error::verify.sh no longer reports a weather step"
            exit 1
          }
